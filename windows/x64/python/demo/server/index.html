<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniHand API Demo</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
            line-height: 1.5;
            min-height: 100vh;
        }

        .header {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 16px 24px;
            font-size: 14px;
            color: #666;
        }
        .header span {
            color: #1a73e8;
            font-weight: 600;
        }

        .container {
            max-width: 680px;
            margin: 24px auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
            padding: 20px;
        }
        .card h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .form-row > * { flex: 1; }

        select, input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.15s;
        }
        select:focus, input:focus { border-color: #1a73e8; }

        #conn_config { margin-bottom: 12px; }
        #conn_config label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }
        #conn_config input { margin-top: 2px; }

        button {
            padding: 8px 20px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #1557b0; }
        button:active { background: #12479a; }

        .result {
            margin-top: 12px;
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 13px;
            color: #444;
            word-break: break-all;
            min-height: 20px;
        }
        .method-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            min-height: 0;
        }
        #param-container { margin-bottom: 12px; }
        #param-container label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }
        #param-container input { margin-top: 2px; }
        .result:empty { display: none; }
        input:invalid { border-color: #e81123; }

    </style>
</head>
<body>
    <div class="header">
        Server:
        <input id="server-host-input" type="text" value="127.0.0.1:8000"
               style="width:180px;padding:2px 6px;font-size:13px;border:1px solid #ccc;border-radius:4px;margin-left:4px;">
        <span id="server-host" style="display:none;"></span>
    </div>

    <div class="container">
        <div class="card" id="health-check">
            <h2>Health Check</h2>
            <button id="health-check-btn">Check Health</button>
            <div class="result" id="health-check-result"></div>
        </div>

        <div class="card" id="hand-create">
            <h2>Create Hand</h2>
            <div class="form-row">
                <select id="product-type-select"></select>
                <select id="connection-type-select"></select>
            </div>
            <div id="conn_config"></div>
            <button id="hand-create-btn">Create Hand</button>
            <div class="result" id="hand-create-result"></div>
        </div>

        <div class="card" id="hand-query">
            <h2>Query Hands</h2>
            <button id="hand-query-btn">Query Hand</button>
            <div class="result" id="hand-query-result"></div>
        </div>
        <div class="card" id="hand-vendor-info">
            <h2>Query Vendor Info</h2>
            <button id="hand-vendor-info-btn">Query Vendor Info</button>
            <div class="result" id="hand-vendor-info-result"></div>
        </div>
        <div class="card" id="hand-delete">
            <h2>Delete Hand</h2>
            <input type="text" id="hand-id-input" placeholder="Enter hand ID to delete" required>
            <button id="hand-delete-btn">Delete Hand</button>
            <div class="result" id="hand-delete-result"></div>
        </div>
        <div class="card" id="method-call">
            <h2>Method Call</h2>
            <div class="form-row">
                <select id="method-call-hand-select">
                    <option value="" disabled selected>-- Select hand ID --</option>
                </select>
                <select id="method-for-method-call-select" disabled>
                    <option value="" disabled selected>-- Select method --</option>
                </select>
            </div>
            <div id="param-container"></div>
            <div id="method-description" class="method-desc"></div>
            <button id="method-call-btn">Call</button>
            <div class="result" id="method-call-result"></div>
        </div>

        <div class="card" id="hand-method-query">
            <h2>Hand Methods</h2>
            <div class="form-row">
                <select id="method-query-type-select">
                    <option value="" disabled selected>-- Select query type --</option>
                    <option value="hand_id">By Hand ID</option>
                    <option value="product_type">By Product Type</option>
                </select>
                <select id="product-type-for-method-select" style="display:none;">
                </select>
                <select id="hand-id-for-method-select" style="display:none;">
                    <option value="" disabled selected>-- Select a hand --</option>
                </select>
            </div>
            <button id="hand-method-query-btn">Call Method</button>
            <div class="result" id="hand-method-query-result"></div>
        </div>
    </div>
    
    
    <script src="scripts/client.js"></script>

</body>
</html>
