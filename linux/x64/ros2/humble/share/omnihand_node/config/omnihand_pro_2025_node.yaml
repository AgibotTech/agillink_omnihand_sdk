# OmniHand Pro 2025 (O12) Configuration
# Usage: ros2 launch omnihand_node omnihand_pro_2025_node.launch.py config_file:=config/omnihand_pro_2025_node.yaml
# 
# Configure one or two hands:
#   - One hand: omit second hand parameters
#   - Two hands: configure second hand parameters
#   - O12 only supports CANFD: zlg_can or hcan (no RS485 support)
#
# Note: O12 only supports CANFD connections (zlg_can or hcan), not RS485

omnihand_pro_2025_param_reader:
  ros__parameters:
    # First hand configuration
    hand_type: "left"                  # "left" or "right"
    hand_device_id: 1                  # Hand device ID (1-255)
    connection_type: "zlg_can"         # "zlg_can" or "hcan" (O12 only supports CANFD)
    
    # For zlg_can or hcan - two ways to specify device:
    # Method 1 (recommended): Use serial number (stable after reboot/plug-unplug)
    canfd_serial_number: ""            # CANFD adapter serial number (recommended)
    # Method 2 (alternative): Use device ID (may change after reboot/plug-unplug)
    # canfd_device_id: 0                # CANFD adapter device index (alternative)
    canfd_channel_id: 0                # CAN channel index (0 or 1)
    
    # Second hand configuration (optional - if configured, second hand will be started)
    # 默认不配置第二个手，只启动第一个手
    # 如需启动两个手，取消注释并配置以下参数：
    # second_hand_type: "right"
    # second_hand_device_id: 1
    # second_connection_type: "zlg_can"
    # second_canfd_serial_number: ""     # CANFD adapter serial number (recommended)
    # second_canfd_channel_id: 1         # CAN channel index (0 or 1)
