# OmniHand 2025 (O10) Configuration - Right Hand Only
# Usage: ros2 run omnihand_node omnihand_2025_node --ros-args --params-file ros2/config/omnihand_2025_right.yaml

omnihand_2025_param_reader:
  ros__parameters:
    # Hand type: "left" or "right"
    hand_type: "right"
    
    # Hand device ID (1-255, as configured in hand firmware)
    hand_device_id: 1
    
    # USB CANFD adapter device index (usually 0)
    canfd_device_id: 0
    
    # CAN channel index on the adapter (0 or 1)
    canfd_channel_id: 0
    
    # Set to true to enable dual-hand mode
    enable_both_hands: false
