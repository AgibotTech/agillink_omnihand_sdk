# OmniPicker 3 (OP3) Configuration
# connection_type: "zlgcan" | "hcan" | "socketcan" | "rs485"

/**:
  ros__parameters:
    # Enable one or both sides as required. OP3 stores hand type only for
    # identification; it does not change gripper control behaviour.
    left_hand:
      hand_device_id: 1
      connection_type: "socketcan"
      can_interface: "can0"
      request_interval_ms: 0
      frame_recv_timeout_ms: 50
      show_data_details: true

    # right_hand:
    #   hand_device_id: 1
    #   connection_type: "socketcan"
    #   can_interface: "can1"
    #   request_interval_ms: 0
    #   frame_recv_timeout_ms: 50
    #   show_data_details: false

    # RS485 example:
    # left_hand:
    #   hand_device_id: 1
    #   connection_type: "rs485"
    #   uart_port: "/dev/ttyUSB0"
    #   request_interval_ms: 0
    #   frame_recv_timeout_ms: 50
    #   show_data_details: false
