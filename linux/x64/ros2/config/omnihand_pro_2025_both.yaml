# OmniHand Pro 2025 (O12) Configuration - Both Hands
# Usage: ros2 run omnihand_node omnihand_pro_2025_node --ros-args --params-file ros2/config/omnihand_pro_2025_both.yaml
# 
# Typical setup with USBCANFD-200U (2 channels):
#   - Left hand on channel 0
#   - Right hand on channel 1

omnihand_pro_2025_param_reader:
  ros__parameters:
    # First hand (left)
    hand_type: "left"
    hand_device_id: 1
    canfd_device_id: 0
    canfd_channel_id: 0
    
    # Enable dual-hand mode
    enable_both_hands: true
    
    # Second hand (right)
    second_hand_type: "right"
    second_hand_device_id: 1
    second_canfd_device_id: 0
    second_canfd_channel_id: 1
